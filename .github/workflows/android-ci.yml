name: LinguaFloat Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linguafloat-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build Debug APK & Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set Up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK Licenses & Install Android SDK 36.1 Packages
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

      - name: Set Up Gradle & Dependency Caching
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Verify Gradle Wrapper Version
        run: ./gradlew --version

      - name: Run Unit and Robolectric Tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build Native Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify Debug APK Existence
        shell: bash
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Expected debug APK was not generated at $APK_PATH"
            exit 1
          fi
          ls -lh "$APK_PATH"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinguaFloat-Android-Debug
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LinguaFloat-Test-Reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Build Diagnostic Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: LinguaFloat-Build-Diagnostics
          path: |
            app/build/reports/
            build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
