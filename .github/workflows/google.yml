name: Android Professional Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Project Structure
        shell: bash
        run: |
          echo "Checking Android project structure..."
          for required in "./gradlew" "./gradlew.bat" "./gradle/wrapper/gradle-wrapper.jar" "./gradle/wrapper/gradle-wrapper.properties"; do
            if [ ! -f "$required" ]; then
              echo "::error::Missing required Gradle wrapper file: $required"
              exit 1
            fi
          done
          chmod +x ./gradlew
          if [ ! -f "./settings.gradle" ] && [ ! -f "./settings.gradle.kts" ]; then
            echo "::error::Missing settings.gradle or settings.gradle.kts at repository root."
            exit 1
          fi
          if [ ! -f "./build.gradle" ] && [ ! -f "./build.gradle.kts" ]; then
            echo "::error::Missing root build.gradle or build.gradle.kts."
            exit 1
          fi
          echo "Project structure verified."

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set Up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK Licenses & Install Android SDK 36.1
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

      - name: Set Up Gradle & Dependency Caching
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Debug Keystore Exists
        shell: bash
        run: |
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Verify Build Environment
        shell: bash
        run: |
          java -version
          ./gradlew --version
          sdkmanager --list_installed

      - name: Build Native Android Debug APK
        shell: bash
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK Output
        shell: bash
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Debug APK was not generated at $APK_PATH"
            exit 1
          fi
          ls -lh "$APK_PATH"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-Debug-APK-${{ github.run_number }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Run Unit and Robolectric Tests
        shell: bash
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-Test-Reports-${{ github.run_number }}
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Build Diagnostic Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Android-Build-Diagnostics-${{ github.run_number }}
          path: |
            app/build/reports/
            build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
